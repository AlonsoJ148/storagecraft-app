<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StorageCraft - Dispositivos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        h1, h2, h3, .navbar-brand { font-family: 'Press Start 2P', cursive; }
        .navbar-brand { font-size: 1.2rem; text-transform: uppercase; }
        .btn-retro { font-family: 'Press Start 2P', cursive; font-size: 0.75rem; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-body-tertiary">

    <!-- Menú compartido -->
    <div th:replace="~{fragmentos/navbar :: menu}"></div>

    <div class="container mt-4">
        <h1 class="h2 mb-4 text-danger">Control de Dispositivos de Redstone</h1>
        
        <div class="row g-4">
            <!-- Itera sobre los dispositivos en memoria RAM -->
            <div class="col-md-6 col-lg-3" th:each="disp : ${dispositivos}">
                <div class="card bg-dark text-white border-4 p-3 shadow-sm h-100"
                     th:classappend="${disp.estado == 'ACTIVO'} ? 'border-start border-success' : 'border-start border-danger'">
                    
                    <h5 th:classappend="${disp.estado == 'ACTIVO'} ? 'text-success' : 'text-danger'" 
                        th:text="${disp.nombre}">Nombre</h5>
                        
                    <p class="text-muted small" th:text="${disp.tipo}">Tipo</p>
                    
                    <!-- Insignia dinámica: Verde si es Activo, Rojo si es Inactivo -->
                    <td>
                        <span th:class="${#strings.equalsIgnoreCase(disp.estado, 'Activo') ? 'badge bg-success' : 'badge bg-danger'}"
                            th:text="${disp.estado}">
                        </span>
                    </td>
                    
                    <!-- Botón conectado a Spring Boot -->
                    <a th:href="@{/dispositivos/alternar/{id}(id=${disp.id})}" 
                       class="btn btn-outline-light btn-sm mt-auto btn-retro">
                        Alternar Señal
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
