<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StorageCraft - Reportes de Movimientos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Librería Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        h1, h2, h3, .navbar-brand { font-family: 'Press Start 2P', cursive; }
        .navbar-brand { font-size: 1.2rem; text-transform: uppercase; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-body-tertiary">

    <!-- Menú compartido -->
    <div th:replace="~{fragmentos/navbar :: menu}"></div>

    <div class="container mt-4">
        <h1 class="h2 mb-4 text-info">Historial y Flujo Semanal</h1>

        <!-- 3. Lineal -->
        <div class="card p-4 shadow-sm bg-dark text-white mb-5">
            <h5 class="text-center text-info mb-3">Flujo Semanal: Ingresos vs Retiros (Lineal)</h5>
            <canvas id="graficoLineal" style="max-height: 280px;"></canvas>
        </div>
    </div>

    <script>
        // 3. Lineal
        new Chart(document.getElementById('graficoLineal'), {
            type: 'line',
            data: {
                labels: ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'],
                datasets: [
                    {
                        label: 'Ingresos',
                        data: [1200, 1900, 3200, 2400, 4100, 6200, 5700],
                        borderColor: '#198754',
                        tension: 0.3
                    },
                    {
                        label: 'Retiros',
                        data: [800, 1100, 1400, 2000, 1700, 3800, 4200],
                        borderColor: '#dc3545',
                        tension: 0.3
                    }
                ]
            },
            options: { responsive: true }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
