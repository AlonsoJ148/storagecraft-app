<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StorageCraft - Historial de Transacciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        h1, h2, h3, .navbar-brand { font-family: 'Press Start 2P', cursive; }
        .navbar-brand { font-size: 1.2rem; text-transform: uppercase; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-body-tertiary">

    <!-- Menú compartido -->
    <div th:replace="~{fragmentos/navbar :: menu}"></div>

    <div class="container mt-4">
        <h1 class="h2 mb-4 text-warning">Historial de Transacciones y Movimientos</h1>

        <div class="card shadow-sm border-0 bg-dark text-white">
            <div class="table-responsive">
                <table class="table table-dark table-hover table-striped mb-0 align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha y Hora</th>
                            <th>Jugador / Usuario</th>
                            <th>Operación</th>
                            <th>Ítem</th>
                            <th>Cantidad</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${transacciones}">
                            <td th:text="'#' + ${t.id}"></td>
                            <td class="text-secondary small" th:text="${t.fecha}"></td>
                            <td class="fw-bold" th:text="${t.usuario}"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${t.tipo == 'INGRESO'} ? 'bg-success' : 'bg-danger'"
                                      th:text="${t.tipo}">
                                </span>
                            </td>
                            <td th:text="${t.nombreItem}"></td>
                            <td class="font-monospace" th:text="${#numbers.formatInteger(t.cantidad, 1, 'POINT')}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(transacciones)}">
                            <td colspan="6" class="text-center text-muted py-4">No hay movimientos registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
