<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StorageCraft - Búsqueda y Filtro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        h1, h2, h3, .navbar-brand { font-family: 'Press Start 2P', cursive; }
        .navbar-brand { font-size: 1.2rem; text-transform: uppercase; }
        .btn-retro { font-family: 'Press Start 2P', cursive; font-size: 0.75rem; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-body-tertiary">

    <!-- Menú centralizado -->
    <div th:replace="~{fragmentos/navbar :: menu}"></div>

    <div class="container mt-4">
        <h1 class="h2 text-info mb-4">Módulo de Búsqueda y Filtro</h1>

        <!-- Formulario que envía el parámetro de búsqueda -->
        <div class="card bg-dark text-white p-4 shadow-sm border-0 mb-4">
            <form th:action="@{/items/consultar}" method="get" class="row g-2 align-items-center">
                <div class="col-md-9">
                    <input type="text" 
                           name="criterio" 
                           th:value="${criterio}" 
                           class="form-control" 
                           placeholder="Buscar por nombre (ej: Diamante) o categoría (ej: Redstone)...">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-info w-100 btn-retro">Filtrar</button>
                </div>
            </form>
        </div>

        <!-- Tabla con resultados de la búsqueda -->
        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover table-striped mb-0 align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Ítem</th>
                            <th>Categoría</th>
                            <th>Ubicación</th>
                            <th>Cantidad Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="it : ${items}">
                            <td th:text="'#' + ${it.id}"></td>
                            <td class="fw-bold" th:text="${it.nombre}"></td>
                            <td><span class="badge bg-primary" th:text="${it.categoria}"></span></td>
                            <td th:text="${it.cofreUbicacion}"></td>
                            <td th:text="${#numbers.formatInteger(it.cantidad, 1, 'POINT')}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(items)}">
                            <td colspan="5" class="text-center text-muted py-4">No se hallaron coincidencias en el inventario.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
